name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repo. The token is also what the third-party gitleaks action gets.
permissions:
  contents: read

jobs:
  powershell:
    # Windows: winget only runs there
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned, so a new release's rules can't fail a build on their own; bump by hand
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          foreach ($result in $results) {
              $level = if ($result.Severity -eq 'Error') { 'error' } else { 'warning' }
              $file = [IO.Path]::GetRelativePath($PWD, $result.ScriptPath) -replace '\\', '/'
              $line = if ($result.Line) { $result.Line } else { 1 }  # file-level rules have no line
              Write-Output "::$level file=$file,line=${line}::$($result.RuleName): $($result.Message)"
          }
          if ($results) { exit 1 }

      # The symlinked configs are edited by hand as well as by their apps; a broken one only shows when the app
      # next starts. VS Code and Windows Terminal read comments and trailing commas, the rest must be strict JSON.
      - name: Parse JSON configs
        shell: pwsh
        run: |
          $jsonWithComments = @(
              'home/AppData/Roaming/Code/User/settings.json'
              'home/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json'
          )
          $failed = $false
          foreach ($file in git ls-files '*.json') {
              $options = [System.Text.Json.JsonDocumentOptions]::new()
              if ($file -in $jsonWithComments) {
                  $options.CommentHandling = [System.Text.Json.JsonCommentHandling]::Skip
                  $options.AllowTrailingCommas = $true
              }
              try { [System.Text.Json.JsonDocument]::Parse([IO.File]::ReadAllText($file), $options).Dispose() }
              catch {
                  $jsonError = $_.Exception.InnerException  # the JsonException, which has a 0-based LineNumber
                  Write-Output "::error file=$file,line=$($jsonError.LineNumber + 1)::$($jsonError.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # A listed package gets its updates from UniGetUI (AutoUpdatedPackages.json) or from somewhere else, such as its
      # own updater ("*" in IgnoredPackageUpdates.json): decided when it is added, so none is quietly left behind
      - name: Check that every listed package has an update source
        shell: pwsh
        run: |
          $covered = foreach ($file in 'AutoUpdatedPackages.json', 'IgnoredPackageUpdates.json') {
              (Get-Content "Config/UniGetUI/$file" -Raw | ConvertFrom-Json -AsHashtable).Keys -replace '^winget\\'
          }
          $failed = $false
          foreach ($list in Get-ChildItem Config/WinGet -Filter *.dsc.yaml) {
              $units = (Get-Content $list.FullName -Raw) -split '(?m)^[ \t]*- resource:[ \t]*'
              foreach ($unit in $units | Where-Object { $_.StartsWith('Microsoft.WinGet.DSC/WinGetPackage') }) {
                  # The package ID is the id indented under settings:, not the unit's own id above it
                  if ($unit -notmatch '(?ms)^([ \t]+)settings:[ \t]*\r?$.*?^\1[ \t]+id:[ \t]*(\S+)') { continue }
                  $packageId = $Matches[2]
                  if ($packageId -notin $covered) {
                      $line = (Select-String -LiteralPath $list.FullName -Pattern "id:\s*$([regex]::Escape($packageId))\s*$" | Select-Object -First 1).LineNumber
                      Write-Output "::error file=Config/WinGet/$($list.Name),line=$line::$packageId has no update source: mark it for automatic updates in UniGetUI, or ignore its updates there if it updates itself"
                      $failed = $true
                  }
              }
          }
          if ($failed) { exit 1 }

      # Checks the schema and that every resource exists (downloading their DSC modules), without applying anything
      - name: Validate the WinGet configurations
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction Ignore)) {
              Install-PSResource -Name Microsoft.WinGet.Client -TrustRepository
              Repair-WinGetPackageManager -AllUsers -Latest
          }
          $failed = $false
          foreach ($file in Get-ChildItem Config/WinGet -Filter *.dsc.yaml) {
              winget configure validate --file $file.FullName --disable-interactivity
              if ($LASTEXITCODE) { Write-Output "::error file=Config/WinGet/$($file.Name)::winget configure validate failed (exit code $LASTEXITCODE)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  chezmoi:
    # Renders every template - config, ignore rules, symlinks, scripts - for both roles, as `chezmoi apply` would,
    # without running anything: on Windows, and on Linux as in WSL. There is no age key here, so the encrypted
    # work overlay is left out.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A pinned release, checked against the hashes from its chezmoi_<version>_checksums.txt, instead of running
      # the latest install script. Dependabot doesn't see these: bump them by hand.
      CHEZMOI_VERSION: 2.72.2
      CHEZMOI_SHA256_WINDOWS: 5c2038736c485d4e3eaad4ac06ea1fe3c4b63d4d51e470547bf12737c02f37f6
      CHEZMOI_SHA256_LINUX: a2be1b8bcdf06c6f173e070bb3ddbcc52c50478fe9b57f6e6c63d15c7cff4f03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'chezmoi.zip'
          Invoke-WebRequest "https://github.com/twpayne/chezmoi/releases/download/v$env:CHEZMOI_VERSION/chezmoi_${env:CHEZMOI_VERSION}_windows_amd64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:CHEZMOI_SHA256_WINDOWS) { Write-Output "::error::chezmoi download doesn't match its checksum"; exit 1 }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'bin')

      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo "$RUNNER_TEMP/chezmoi.tar.gz" "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          echo "${CHEZMOI_SHA256_LINUX}  $RUNNER_TEMP/chezmoi.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/bin" chezmoi

      - name: Render the private and work setups
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:RUNNER_TEMP 'bin') + [IO.Path]::PathSeparator + $env:PATH
          # Both roles, one with a Dev Drive and one without
          $setups = @(
              @{ Role = 'private'; DevDrive = 'none' }
              @{ Role = 'work'; DevDrive = 'D:' }
          )
          foreach ($setup in $setups) {
              $name = $setup.Role
              $config = Join-Path $env:RUNNER_TEMP "chezmoi-$name.toml"
              $isolated = "--config=$config", "--destination=$(Join-Path $env:RUNNER_TEMP "home-$name")", "--persistent-state=$(Join-Path $env:RUNNER_TEMP "state-$name.boltdb")"
              chezmoi init --no-tty --source $PWD @isolated --promptChoice "Machine role (work adds the encrypted work overlay)=$($setup.Role)" --promptString "Dev Drive for the package caches (a drive like D: or none)=$($setup.DevDrive)"
              if ($LASTEXITCODE) { Write-Output "::error::chezmoi init failed for the $name setup"; exit 1 }
              chezmoi apply --no-tty --dry-run --exclude=encrypted @isolated
              if ($LASTEXITCODE) { Write-Output "::error::chezmoi could not render the $name setup"; exit 1 }
          }

  shell:
    # ubuntu-latest ships ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck Scripts/WSLSetup.sh Scripts/Setup/install-wsl-packages.sh home/dot_config/bash/dotfiles.sh .githooks/pre-commit

  leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the commits of a pull request through the API
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the commits of the push or pull request

      # This repo is public, and the VS Code settings are shared with the work machine, where the mssql extension
      # saves its connections. Reports file and line only, so the log doesn't repeat what it found.
      - name: Check for work infrastructure
        run: |
          # mssql connections and their groups; private IPv4 ranges (and CGNAT 100.64/10, used by VPNs) and IPv6
          # unique local addresses (starting with fc or fd)
          pattern='"mssql\.connection(s|Groups)"|(?<![\d.])(10\.\d{1,3}|172\.(1[6-9]|2\d|3[01])|192\.168|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}(?!\.?\d)|(?<![\w:])f[cd][0-9a-f]{2}(:[0-9a-f]{0,4}){2,7}(?![\w:])'
          # git grep exits 1 when nothing matches; anything above that is a broken check, not a clean tree
          status=0
          matches="$(git grep -nIP "$pattern")" || status=$?
          if [ "$status" -gt 1 ]; then
              echo "::error::git grep failed (exit code $status)"
              exit 1
          fi
          # A four-part version number (10.1.0.0) looks like an address: skip lines about versions
          matches="$(printf '%s\n' "$matches" | grep -viE '^[^:]+:[0-9]+:.*version' || true)"
          if [ -n "$matches" ]; then
              printf '%s\n' "$matches" | while IFS=: read -r file line _; do
                  echo "::error file=$file,line=$line::Work database connection or private network address in a public repo"
              done
              exit 1
          fi

      # Pinned to a commit, not a tag: a third-party action runs with the token. Dependabot updates the pin.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on pull requests would need write access; the job summary shows the result
          GITLEAKS_ENABLE_COMMENTS: false
